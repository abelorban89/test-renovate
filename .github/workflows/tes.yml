name: Test

on:
  push:
    branches-ignore:
      - main
  pull_request:
    types:
      - opened

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm test
